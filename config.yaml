# 유튜브 트렌드 (YOUTUBE_API_KEY 없으면 이 섹션은 생략됩니다)
# ─────────────────────────────────────────────
유튜브:
  사용: true
  급상승_표시개수: 5
  댓글_분석_영상수: 3
  # 매일 반복되는 정례 라이브는 새 영상 주제·반응을 보는 목록에서 제외합니다.
  # 다른 채널이 새로 시작한 라이브는 전략 변화일 수 있으므로 일괄 제외하지 않습니다.
