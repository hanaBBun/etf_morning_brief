# ETF 아는형 아침 브리핑 설정
# 이 파일만 고치면 브리핑 내용이 바뀝니다. 코드는 건드릴 필요 없습니다.

브리핑:
  제목: "아침 경제·ETF 브리핑"
  발송시각_KST: "07:00"
  사이트_주소: "https://hanabbun.github.io/etf_morning_brief/"   # GitHub Pages 주소

# ─────────────────────────────────────────────
# 종목 편성 기준 (시가총액 제한 없음)
# 아래 조건 중 하나라도 해당하면 '주목할 종목' 표에 들어갑니다.
# ─────────────────────────────────────────────
종목_편성기준:
  거래대금_상위: 20          # ① 전일 거래대금 상위 N위 안이면 무조건 포함
  등락률_임계치: 3.0          # ② 등락률 ±N% 이상이고
  등락률_거래대금_상위: 100   #    거래대금 상위 N위 안이면 포함 (유동성 필터)
  수급_상위: 10               # ③ 외국인·기관 순매수/순매도 상위 N위면 포함
  신고가_신저가_포함: true    # ④ 52주 신고가·신저가 경신 종목 포함
  최소_거래대금_억원: 100     # 이보다 거래가 적으면 제외 (허수 급등락 차단)
  최대_표시개수: 12           # 안전장치. 조건 통과가 너무 많을 때만 잘라냅니다.

미국종목_편성기준:
  등락률_임계치: 5.0
  최소_시가총액_억달러: 20
  최대_표시개수: 10

# ─────────────────────────────────────────────
# ETF 레이더 (핵심 3개 + 접어 두는 추가 뉴스 최대 5개)
# ─────────────────────────────────────────────
ETF_레이더:
  최대_항목수: 8
  흐름판_최소거래대금_억원: 50  # 거래가 적은 ETF의 허수 급등락 제외
  흐름판_상하위개수: 3
  순매수_임계치_억원: 300      # 전일 순매수/순매도가 이 이상이면 후보
  자금유입_5일_임계치_억원: 1000
  순자산_증가율_임계치_퍼센트: 10
  거래량_급증_배수: 3.0        # 20일 평균 대비 N배 이상
  신규상장_항상포함: true

# ─────────────────────────────────────────────
# 추적할 시장 지표
# ─────────────────────────────────────────────
지표:
  국내:
    - { 이름: "코스피",   티커: "^KS11" }
    - { 이름: "코스닥",   티커: "^KQ11" }
    - { 이름: "원/달러",  티커: "KRW=X" }
  해외지수:
    - { 이름: "S&P 500",     티커: "^GSPC" }
    - { 이름: "나스닥 종합",  티커: "^IXIC" }
    - { 이름: "다우 30",     티커: "^DJI" }
    - { 이름: "러셀 2000",   티커: "^RUT" }
    - { 이름: "필라델피아 반도체", 티커: "^SOX" }
  금리:
    - { 이름: "미 10년물", 티커: "^TNX" }
    - { 이름: "미 30년물", 티커: "^TYX" }
  원자재:
    - { 이름: "WTI",     티커: "CL=F" }
    - { 이름: "브렌트",   티커: "BZ=F" }
    - { 이름: "금",      티커: "GC=F" }
    - { 이름: "구리",    티커: "HG=F" }
  변동성:
    - { 이름: "VIX",     티커: "^VIX" }

# ─────────────────────────────────────────────
# 뉴스 소스 (RSS)
# ─────────────────────────────────────────────
뉴스:
  # 네이버 뉴스 검색에서 익숙하게 접하는 주요 매체를 한 번 더 넓게 찾습니다.
  # 실제 화면에는 '구글뉴스 주요언론'이 아니라 RSS가 제공한 원 발행사명이 표시됩니다.
  주요언론:
    - { 이름: "구글뉴스 주요 경제지", url: "https://news.google.com/rss/search?q=(site%3Ahankyung.com%20OR%20site%3Amk.co.kr%20OR%20site%3Amt.co.kr%20OR%20site%3Asedaily.com%20OR%20site%3Afnnews.com)%20(%EC%A6%9D%EC%8B%9C%20OR%20ETF%20OR%20%EA%B8%88%EB%A6%AC)%20when%3A3d&hl=ko&gl=KR&ceid=KR%3Ako" }
    - { 이름: "구글뉴스 주요 종합지", url: "https://news.google.com/rss/search?q=(site%3Ayna.co.kr%20OR%20site%3Anewsis.com%20OR%20site%3Anewspim.com%20OR%20site%3Aasiae.co.kr%20OR%20site%3Awowtv.co.kr)%20(%EC%A6%9D%EC%8B%9C%20OR%20ETF%20OR%20%EA%B2%BD%EC%A0%9C)%20when%3A3d&hl=ko&gl=KR&ceid=KR%3Ako" }
  국내:
    - { 이름: "연합뉴스 경제",   url: "https://www.yna.co.kr/rss/economy.xml" }
    - { 이름: "한국경제 증권",   url: "https://www.hankyung.com/feed/finance" }
    - { 이름: "매일경제 증권",   url: "https://www.mk.co.kr/rss/50200011/" }
    - { 이름: "이데일리 증권",   url: "https://rss.edaily.co.kr/stock_news.xml" }
  국제:
    - { 이름: "구글뉴스 국제경제", url: "https://news.google.com/rss/search?q=global+economy+markets+when:7d&hl=en-US&gl=US&ceid=US:en" }
    - { 이름: "구글뉴스 연준",     url: "https://news.google.com/rss/search?q=federal+reserve+treasury+yields+when:7d&hl=en-US&gl=US&ceid=US:en" }
  세계정세:
    - { 이름: "구글뉴스 지정학", url: "https://news.google.com/rss/search?q=war+conflict+sanctions+trade+oil+markets+when:7d&hl=en-US&gl=US&ceid=US:en" }
    - { 이름: "구글뉴스 국제정책", url: "https://news.google.com/rss/search?q=tariffs+geopolitics+energy+shipping+economy+when:7d&hl=en-US&gl=US&ceid=US:en" }
  ETF:
    - { 이름: "구글뉴스 국내ETF", url: "https://news.google.com/rss/search?q=ETF+when:3d&hl=ko&gl=KR&ceid=KR:ko" }
    - { 이름: "구글뉴스 ETF테마", url: "https://news.google.com/rss/search?q=ETF+(%EB%A0%88%EB%B2%84%EB%A6%AC%EC%A7%80+OR+%EA%B8%88+OR+%EB%B0%94%EC%9D%B4%EC%98%A4+OR+%ED%99%94%EC%9E%A5%ED%92%88+OR+%EB%B9%84%ED%8A%B8%EC%BD%94%EC%9D%B8)+when:3d&hl=ko&gl=KR&ceid=KR:ko" }
    - { 이름: "구글뉴스 해외ETF", url: "https://news.google.com/rss/search?q=ETF+flows+OR+launch+when:7d&hl=en-US&gl=US&ceid=US:en" }

  # 증권·경제 직접 피드 — 링크가 언론사 원문이라 본문(발언 인용)을 긁을 수 있습니다.
  # 구글뉴스 링크는 중계 주소라 본문이 안 잡힙니다. 발언정리는 이 그룹이 먹여 살립니다.
  # 만약 실행 로그에서 이 그룹이 0건으로 나오면 알려주세요. 주소를 바꾸겠습니다.
  증권:
    - { 이름: "서울경제 증권",   url: "https://www.sedaily.com/RSS/S1N4.xml" }
    - { 이름: "머니투데이 증권", url: "https://rss.mt.co.kr/mt_stock.xml" }
    - { 이름: "파이낸셜뉴스 증권", url: "https://www.fnnews.com/rss/r_stock.xml" }
    - { 이름: "아시아경제 증권", url: "https://www.asiae.co.kr/rss/stock.htm" }

  # ETF 시장 전반 — 특정 상품이 아니라 '시장'에 관한 기사.
  # 거래대금, 규제·제도, 판매 채널(퇴직연금·ISA), 유형별 자금 이동.
  # ETF 레이더가 운용사 홍보성 기사로 채워지지 않게 하는 균형추입니다.
  ETF시장:
    - { 이름: "구글뉴스 ETF시장", url: "https://news.google.com/rss/search?q=ETF%20%EA%B1%B0%EB%9E%98%EB%8C%80%EA%B8%88%20OR%20%EC%88%9C%EC%9C%A0%EC%9E%85%20OR%20%EC%8B%9C%EC%9E%A5%EA%B7%9C%EB%AA%A8%20OR%20%EA%B7%9C%EC%A0%9C%20OR%20%EC%83%81%EC%9E%A5%ED%8F%90%EC%A7%80%20when%3A7d&hl=ko&gl=KR&ceid=KR:ko" }
    - { 이름: "구글뉴스 ETF제도", url: "https://news.google.com/rss/search?q=ETF%20%ED%87%B4%EC%A7%81%EC%97%B0%EA%B8%88%20OR%20%EC%97%B0%EA%B8%88%EC%A0%80%EC%B6%95%20OR%20ISA%20OR%20%EC%84%B8%EC%A0%9C%20OR%20%EA%B8%88%EC%9C%B5%EB%8B%B9%EA%B5%AD%20when%3A7d&hl=ko&gl=KR&ceid=KR:ko" }
    - { 이름: "구글뉴스 ETF수급", url: "https://news.google.com/rss/search?q=ETF%20%EA%B0%9C%EC%9D%B8%20%EC%88%9C%EB%A7%A4%EC%88%98%20OR%20%EC%9E%90%EA%B8%88%EC%9D%B4%EB%8F%99%20OR%20%ED%95%B4%EC%99%B8%EC%A3%BC%EC%8B%9D%ED%98%95%20OR%20%EC%B1%84%EA%B6%8C%ED%98%95%20when%3A7d&hl=ko&gl=KR&ceid=KR:ko" }

  # 운용사 보도자료 — 신규 상장·보수 인하·순자산 발표는 대부분 보도자료가 원출처입니다.
  # 목요일 전달문에서 '무엇이 새로 나왔는지'를 잡는 핵심 소스입니다.
  # 홍보성이 강해서 아침 브리핑에는 적게 넘깁니다.
  보도자료:
    - { 이름: "구글뉴스 운용사보도자료", url: "https://news.google.com/rss/search?q=%EC%9E%90%EC%82%B0%EC%9A%B4%EC%9A%A9%20ETF%20%EC%83%81%EC%9E%A5%20OR%20%EB%B3%B4%EC%88%98%20OR%20%EC%88%9C%EC%9E%90%EC%82%B0%20OR%20%EB%B3%B4%EB%8F%84%EC%9E%90%EB%A3%8C%20when%3A7d&hl=ko&gl=KR&ceid=KR:ko" }
    - { 이름: "구글뉴스 뉴스와이어", url: "https://news.google.com/rss/search?q=site%3Anewswire.co.kr%20ETF%20OR%20%EC%9E%90%EC%82%B0%EC%9A%B4%EC%9A%A9%20when%3A7d&hl=ko&gl=KR&ceid=KR:ko" }

  # 레버리지·인버스 — 개인 수급이 몰리는 구간이라 코너 소재가 자주 나옵니다.
  레버리지:
    - { 이름: "구글뉴스 레버리지", url: "https://news.google.com/rss/search?q=%EB%A0%88%EB%B2%84%EB%A6%AC%EC%A7%80%20ETF%20OR%20%EC%9D%B8%EB%B2%84%EC%8A%A4%20ETF%20OR%20%EA%B3%B1%EB%B2%84%EC%8A%A4%20when%3A7d&hl=ko&gl=KR&ceid=KR:ko" }

  # 지수 편입·정기변경·리밸런싱 — ETF 구성 종목이 바뀌는 이벤트입니다.
  지수:
    - { 이름: "구글뉴스 지수변경", url: "https://news.google.com/rss/search?q=%EC%A7%80%EC%88%98%20%ED%8E%B8%EC%9E%85%20OR%20%EC%A0%95%EA%B8%B0%EB%B3%80%EA%B2%BD%20OR%20%EB%A6%AC%EB%B0%B8%EB%9F%B0%EC%8B%B1%20ETF%20when%3A7d&hl=ko&gl=KR&ceid=KR:ko" }

  # 확정 경제 일정 후보. 모델은 기사에 실제 날짜가 명시된 일정만 사용합니다.
  일정:
    - { 이름: "구글뉴스 주요경제일정", url: "https://news.google.com/rss/search?q=FOMC%20OR%20%EA%B8%88%ED%86%B5%EC%9C%84%20OR%20PMI%20OR%20CPI%20OR%20%EA%B3%A0%EC%9A%A9%EC%A7%80%ED%91%9C%20OR%20%EC%9E%AD%EC%8A%A8%ED%99%80%20%EB%B0%9C%ED%91%9C%20%EC%9D%BC%EC%A0%95%20when%3A7d&hl=ko&gl=KR&ceid=KR:ko" }
    - { 이름: "구글뉴스 ETF상장일정", url: "https://news.google.com/rss/search?q=ETF%20%EC%83%81%EC%9E%A5%20%EC%98%88%EC%A0%95%20OR%20%EC%83%81%EC%9E%A5%EC%9D%BC%20when%3A7d&hl=ko&gl=KR&ceid=KR:ko" }

  기사_최대개수: 40

# 기사 주제가 같을 때의 편성 우선순위입니다. 목록 밖 매체도 특종·직접 근거가
# 있으면 수집하되, 핵심 브리핑을 생소한 매체 기사만으로 채우지 않게 합니다.
