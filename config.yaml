# ─────────────────────────────────────────────
# 카카오톡 발송
# ─────────────────────────────────────────────
카카오:
  발송건수: 1          # TOP 1~5를 같은 링크의 한 메시지로 발송
  글자수_제한: 195     # 카카오 텍스트 템플릿 200자 제한 - 여유분
  링크_붙이기: true

# ─────────────────────────────────────────────
# AI 요약 (Gemini 무료 티어)
# ─────────────────────────────────────────────
AI:
  제공자: "gemini"                 # gemini | claude | openai
  모델: "gemini-3.6-flash"
  대체모델: ""                     # 비워두면 사용 가능한 모델을 자동으로 찾습니다
  최대_출력토큰: 32768   # 응답이 잘리면 이 값을 늘리세요
  온도: 0.4

# ─────────────────────────────────────────────
# 주간 브리핑 (토요일 07:00)
# ─────────────────────────────────────────────
주간:
  사용: true
  요일: "토"
  포함항목:
    - 국내투자자_해외수급_주간
    - ETF_자금흐름_주간
    - 순자산_순위변동
