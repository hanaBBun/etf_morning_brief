# ETF 아는형 아침 브리핑 설정
# 이 파일만 고치면 브리핑 내용이 바뀝니다. 코드는 건드릴 필요 없습니다.

브리핑:
  제목: "아침 경제·ETF 브리핑"
  발송시각_KST: "07:00"
  사이트_주소: ""   # GitHub Pages 주소. 설정 후 예) https://내아이디.github.io/etf-morning-brief

# ─────────────────────────────────────────────
# 종목 편성 기준 (시가총액 제한 없음)
# 아래 조건 중 하나라도 해당하면 '주목할 종목' 표에 들어갑니다.
# ─────────────────────────────────────────────
종목_편성기준:
  거래대금_상위: 20          # ① 전일 거래대금 상위 N위 안이면 무조건 포함
  등락률_임계치: 3.0          # ② 등락률 ±N% 이상이고
  등락률_거래대금_상위: 100   #    거래대금 상위 N위 안이면 포함 (유동성 필터)
  수급_상위: 10               # ③ 외국인·기관 순매수/순매도 상위 N위면 포함
  신고가_신저가_포함: true    # ④ 52주 신고가·신저가 경신 종목 포함
  최소_거래대금_억원: 100     # 이보다 거래가 적으면 제외 (허수 급등락 차단)
  최대_표시개수: 12           # 안전장치. 조건 통과가 너무 많을 때만 잘라냅니다.

미국종목_편성기준:
  등락률_임계치: 5.0
  최소_시가총액_억달러: 20
  최대_표시개수: 10

# ─────────────────────────────────────────────
# ETF 레이더 (전일 기준, 의미 있는 것만 최대 3개)
# ─────────────────────────────────────────────
ETF_레이더:
  최대_항목수: 3
  순매수_임계치_억원: 300      # 전일 순매수/순매도가 이 이상이면 후보
  자금유입_5일_임계치_억원: 1000
  순자산_증가율_임계치_퍼센트: 10
  거래량_급증_배수: 3.0        # 20일 평균 대비 N배 이상
  신규상장_항상포함: true

# ─────────────────────────────────────────────
# 추적할 시장 지표
# ─────────────────────────────────────────────
지표:
  국내:
    - { 이름: "코스피",   티커: "^KS11" }
    - { 이름: "코스닥",   티커: "^KQ11" }
    - { 이름: "원/달러",  티커: "KRW=X" }
  해외지수:
    - { 이름: "S&P 500",     티커: "^GSPC" }
    - { 이름: "나스닥 종합",  티커: "^IXIC" }
    - { 이름: "다우 30",     티커: "^DJI" }
    - { 이름: "러셀 2000",   티커: "^RUT" }
    - { 이름: "필라델피아 반도체", 티커: "^SOX" }
  금리:
    - { 이름: "미 10년물", 티커: "^TNX" }
    - { 이름: "미 30년물", 티커: "^TYX" }
  원자재:
    - { 이름: "WTI",     티커: "CL=F" }
    - { 이름: "브렌트",   티커: "BZ=F" }
    - { 이름: "금",      티커: "GC=F" }
    - { 이름: "구리",    티커: "HG=F" }
  변동성:
    - { 이름: "VIX",     티커: "^VIX" }

# ─────────────────────────────────────────────
# 뉴스 소스 (RSS)
# ─────────────────────────────────────────────
뉴스:
  국내:
    - { 이름: "연합뉴스 경제",   url: "https://www.yna.co.kr/rss/economy.xml" }
    - { 이름: "한국경제 증권",   url: "https://www.hankyung.com/feed/finance" }
    - { 이름: "매일경제 증권",   url: "https://www.mk.co.kr/rss/50200011/" }
    - { 이름: "이데일리 증권",   url: "https://rss.edaily.co.kr/stock_news.xml" }
  국제:
    - { 이름: "구글뉴스 국제경제", url: "https://news.google.com/rss/search?q=global+economy+markets+when:7d&hl=en-US&gl=US&ceid=US:en" }
    - { 이름: "구글뉴스 연준",     url: "https://news.google.com/rss/search?q=federal+reserve+treasury+yields+when:7d&hl=en-US&gl=US&ceid=US:en" }
  세계정세:
    - { 이름: "구글뉴스 지정학", url: "https://news.google.com/rss/search?q=war+conflict+sanctions+trade+oil+markets+when:7d&hl=en-US&gl=US&ceid=US:en" }
    - { 이름: "구글뉴스 국제정책", url: "https://news.google.com/rss/search?q=tariffs+geopolitics+energy+shipping+economy+when:7d&hl=en-US&gl=US&ceid=US:en" }
  ETF:
    - { 이름: "구글뉴스 국내ETF", url: "https://news.google.com/rss/search?q=ETF+%EC%88%9C%EC%9E%90%EC%82%B0+OR+%EC%83%81%EC%9E%A5+OR+%EC%88%9C%EB%A7%A4%EC%88%98+when:7d&hl=ko&gl=KR&ceid=KR:ko" }
    - { 이름: "구글뉴스 해외ETF", url: "https://news.google.com/rss/search?q=ETF+flows+OR+launch+when:7d&hl=en-US&gl=US&ceid=US:en" }
  기사_최대개수: 40

# ─────────────────────────────────────────────
# 유튜브 트렌드 (YOUTUBE_API_KEY 없으면 이 섹션은 생략됩니다)
# ─────────────────────────────────────────────
유튜브:
  사용: true
  급상승_표시개수: 5
  댓글_분석_영상수: 3
  채널:
    - 머니인사이드
    - 박곰희TV
    - 서대리TV
    - 수페TV
    - 삼프로TV
    - 월급쟁이부자들TV
    - 한국경제TV
    - 소수몽키
    - 부읽남TV
    - 김짠부 재테크
    - 부티플
    - 달란트투자
    - 슈카월드
    - 언더스탠딩
    - 김작가TV
    - 전인구경제연구소
    - 815머니톡
    - 월가아재
    - 미래에셋 스마트머니
    - KODEX
    - 스마트 타이거
    - RISE ETF

# ─────────────────────────────────────────────
# 카카오톡 발송
# ─────────────────────────────────────────────
카카오:
  발송건수: 2          # 1~3 / 4~5와 관전 포인트를 두 메시지로 발송
  글자수_제한: 195     # 카카오 텍스트 템플릿 200자 제한 - 여유분
  링크_붙이기: true

# ─────────────────────────────────────────────
# AI 요약 (Gemini 무료 티어)
# ─────────────────────────────────────────────
AI:
  제공자: "gemini"                 # gemini | claude | openai
  모델: "gemini-3.6-flash"
  대체모델: ""                     # 비워두면 사용 가능한 모델을 자동으로 찾습니다
  최대_출력토큰: 32768   # 응답이 잘리면 이 값을 늘리세요
  온도: 0.4

# ─────────────────────────────────────────────
# 주간 브리핑 (토요일 07:00)
# ─────────────────────────────────────────────
주간:
  사용: true
  요일: "토"
  포함항목:
    - 국내투자자_해외수급_주간
    - ETF_자금흐름_주간
    - 순자산_순위변동
    - 주간_지수흐름
    - 다음주_일정

# ─────────────────────────────────────────────
# 목요일 전달문 (ETF 처방전 출연자용, 목 11:00)
# ETF 뉴스 6선 + 애널리스트 발언 + 출연자 추천
# ─────────────────────────────────────────────
목요일_전달문:
  사용: true
  받는사람: "박승진 실장 (ETF 처방전)"
  뉴스_시작요일: "화"        # 이번 주 이 요일 00시부터의 기사만 모읍니다
  뉴스_선정개수: 6
  본문_수집개수: 14          # 발언 인용을 찾기 위해 본문까지 긁을 기사 수
  발언_최대인원: 6
  출연자추천_최대: 3
  발언_수집범위: "ETF·자산배분"   # ETF 상품·수급·전략, 자산배분, 운용사 리서치
  코너목록:
    - ETF 처방전
    - ETF 반응형
    - 요즘하태형
    - 신상탐구형
    - ETF 어깨형
    - 아는형의 아는형
