name: ETF 전일 마감 시세 저장
on:
  schedule:
    # KST 16:10/17:10/18:10. GitHub 지연 시 주말에도 마지막 영업일을 저장한다.
    - cron: "10 7 * * 1-5"
    - cron: "10 8 * * 1-5"
    - cron: "10 9 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: etf-close-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 장 마감 ETF 시세 저장
        run: python -m src.etf_snapshot
      - name: 저장 결과 반영
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add etf_close_snapshots.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "ETF 마감 시세 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push origin main
