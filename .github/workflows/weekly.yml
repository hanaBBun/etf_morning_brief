name: 주간 브리핑 (토요일 07:00 KST)

on:
  schedule:
    # 금요일 22:00 UTC = 토요일 07:00 KST
    - cron: "0 22 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brief-weekly

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 주간 브리핑 생성 및 발송
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_JAVASCRIPT_KEY: ${{ secrets.KAKAO_JAVASCRIPT_KEY }}
          YOUTUBE_API_KEY:     ${{ secrets.YOUTUBE_API_KEY }}
          GH_PAT:              ${{ secrets.GH_PAT }}
          KRX_ID:              ${{ secrets.KRX_ID }}
          KRX_PW:              ${{ secrets.KRX_PW }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
          TZ: Asia/Seoul
        run: python -m src.main --mode weekly
      - name: 안전성 단위 테스트
        run: python -m unittest discover -s tests -v
      - name: 결과 저장
        run: |
          git config user.name  "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add docs 2>/dev/null || true
          git add channel_ids.json 2>/dev/null || true
          git add channel_uploads.json 2>/dev/null || true
          git add youtube_daily_cache.json 2>/dev/null || true
          git add etf_snapshot_cache.json 2>/dev/null || true
          git status --short
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "주간 브리핑 $(date +%Y-%m-%d)"
            git pull --rebase -X theirs origin main
            git push
          fi
