name: 아침 브리핑 (매일 07:00 KST)

on:
  schedule:
    # 22:00 UTC = 다음날 07:00 KST. 매일 실행.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      no_send:
        description: "카톡 발송 없이 HTML만 생성"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: brief-daily
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 브리핑 생성 및 발송
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          YOUTUBE_API_KEY:     ${{ secrets.YOUTUBE_API_KEY }}
          GH_PAT:              ${{ secrets.GH_PAT }}
          KRX_ID:              ${{ secrets.KRX_ID }}
          KRX_PW:              ${{ secrets.KRX_PW }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
          TZ: Asia/Seoul
        run: |
          python -m src.main --mode daily ${{ inputs.no_send && '--no-send' || '' }}

      - name: 결과 저장 (GitHub Pages)
        run: |
          git config user.name  "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add docs channel_ids.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "브리핑 $(date +%Y-%m-%d)"
            git push
          fi

      - name: 실패 시 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
